spring:
  application:
    name: basic-framework-server
  lifecycle:
    timeout-per-shutdown-phase: 30s # 每个关闭阶段的最大等待，配合 server.shutdown: graceful
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false
  cache:
    type: REDIS
    redis:
      time-to-live: 1h
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    validate-on-migrate: true
server:
  shutdown: graceful # 停止接收新流量后等待在途请求完成
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: ${basic-framework.info.base-package}.module.*.dal.dataobject

mybatis-plus-join:
  banner: false
  sub-table-logic: true
  ms-cache: true
  table-alias: t
  logic-del-type: on

easy-trans:
  is-enable-global: false

aj:
  captcha:
    cache-type: redis
    cache-number: 1000
    timing-clear: 180
    type: blockPuzzle
    water-mark: basic-framework
    interference-options: 0
    req-frequency-limit-enable: false
    req-get-lock-limit: 5
    req-get-lock-seconds: 10
    req-get-minute-limit: 30
    req-check-minute-limit: 60
    req-verify-minute-limit: 60

basic-framework:
  info:
    version: 1.0.0
    base-package: com.basicframework
  web:
    admin-ui:
      url: http://127.0.0.1:3000
  xss:
    enable: true
    exclude-urls:
      - ${management.endpoints.web.base-path}/**
  security:
    permit-all_urls: []
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:}
    session:
      access-token-ttl: ${SESSION_ACCESS_TOKEN_TTL:30m}
      refresh-token-ttl: ${SESSION_REFRESH_TOKEN_TTL:30d}
    mfa:
      enabled: ${MFA_ENABLED:false}
      issuer: ${MFA_ISSUER:basic-framework}
      challenge-ttl: ${MFA_CHALLENGE_TTL:5m}
      step-up-ttl: ${MFA_STEP_UP_TTL:5m}
      webauthn:
        enabled: ${MFA_WEBAUTHN_ENABLED:false}
        rp-id: ${MFA_WEBAUTHN_RP_ID:}
        rp-name: ${MFA_WEBAUTHN_RP_NAME:basic-framework}
        allowed-origins: []
  swagger:
    title: basic-framework API
    description: Admin and app API documentation
    version: ${basic-framework.info.version}
  codegen:
    base-package: ${basic-framework.info.base-package}
    db-schemas: ${spring.datasource.dynamic.datasource.master.name}
    front-type: 50
    vo-type: 10
    delete-batch-enable: true
    unit-test-enable: false
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10

debug: false
